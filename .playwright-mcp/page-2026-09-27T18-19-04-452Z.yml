        - heading "GoodbyeDPI ne işe yarar?" [level=2] [ref=f4e44]
      - article [ref=f4e45]:
        - paragraph [ref=f4e46]: GoodbyeDPI, Windows'ta DPI temelli bağlantı filtrelerini aşmaya yönelik açık kaynaklı bir araçtır. Resmi proje, paketlerin WinDivert ve Windows Filtering Platform üzerinden yerel bilgisayarda işlendiğini açıklar. Bu, uzak sunucu üzerinden trafik yönlendiren klasik bir VPN hizmeti değildir.
        - paragraph [ref=f4e47]:
          - strong [ref=f4e48]: "Güvenlik yazılımı uyumluluğu:"
          - text: Kaspersky veya benzeri bir program WinDivert sürücüsünü engellerse GoodbyeDPI başlatılamaz. Hata durumunda konsol mesajını ve güvenlik yazılımı uyarılarını kontrol et; korumayı kapatma.
        - paragraph [ref=f4e49]:
          - text: Videodaki arşivde Türkiye için hazırlanmış
          - code [ref=f4e50]: turkey_dnsredir
          - text: komut dosyaları ve alternatifleri görünüyor. Bu paket, resmi sürüm arşiviyle aynı kaynakta yayımlanmıyor; dosyaları açmadan önce kaynağı ve script içeriğini ayrıca doğrula.
        - generic "GoodbyeDPI resmi kaynakları" [ref=f4e51]:
          - link "GoodbyeDPI resmi GitHub rehberi" [ref=f4e52] [cursor=pointer]:
