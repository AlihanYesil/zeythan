          - generic [ref=f7e62]: "01"
          - generic [ref=f7e63]:
            - heading "Arşivi indir ve çıkart" [level=3] [ref=f7e64]
            - paragraph [ref=f7e65]:
              - text: Yukarıdaki bağlantıdan SplitWire Turkey 1.5.7 RAR arşivini indir. Windows'un arşiv aracını veya güvendiğin bir arşiv programını kullanarak içeriğini yeni bir klasöre çıkart. Kurulum dosyasının adı videoda
              - strong [ref=f7e66]: SplitWire-Turkey-Setup-Windows.exe
              - text: olarak görünüyor.
            - paragraph [ref=f7e67]:
              - generic [aria-hidden] [ref=f7e68]: 
              - text: "RAR şifresi:"
              - strong [ref=f7e69]: Zeythan
        - article [ref=f7e70]:
          - generic [ref=f7e71]: "02"
          - generic [ref=f7e72]:
            - heading "Kurulum uygulamasını aç" [level=3] [ref=f7e73]
            - paragraph [ref=f7e74]: "Çıkarttığın klasördeki SplitWire-Turkey uygulamasını başlat. Ekran kaydında Windows SmartScreen uyarısı için “Ek bilgi” ve “Yine de çalıştır” adımları anlatılıyor. Bu uyarıyı otomatik olarak geçme: yayıncı bilgisi doğrulanamıyorsa kurulumu durdur ve dosyanın kaynağını doğrula."
        - article [ref=f7e75]:
          - generic [ref=f7e76]: "03"
          - generic [ref=f7e77]:
            - heading "“Standart Kurulum”u seç" [level=3] [ref=f7e78]
            - paragraph [ref=f7e79]: Ana ekranda Standart Kurulum düğmesine tıkla. Onay penceresinde devam etmek istediğini seç. Videoda WireSock bileşeni yüklü olmadığında kurulumun bu bileşeni de indirdiği belirtiliyor.
        - article [ref=f7e80]:
          - generic [ref=f7e81]: "04"
          - generic [ref=f7e82]:
            - heading "Kurulumun bitmesini bekle" [level=3] [ref=f7e83]
            - paragraph [ref=f7e84]: “Kurulum başarıyla tamamlandı” mesajı geldiğinde ekrandaki yönergeyi izle. Değişikliklerin uygulanması için bilgisayarı şimdi yeniden başlatabilir ya da yeniden başlatmayı daha sonraya bırakabilirsin.
        - article [ref=f7e85]:
          - generic [ref=f7e86]: "05"
          - generic [ref=f7e87]:
            - heading "Yeniden başlat ve Discord'u dene" [level=3] [ref=f7e88]
            - paragraph [ref=f7e89]: Videoda bilgisayar yeniden başlatılıyor. Açıldıktan sonra Discord'u çalıştırıp mesaj ve ses bağlantısını kontrol et. Kaydın sonundaki not, standart kurulumun WireSock korumasını yalnızca Discord için uyguladığını söylüyor.
