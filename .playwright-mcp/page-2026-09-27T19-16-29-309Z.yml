    - region [ref=f7e38]:
      - generic [ref=f7e39]:
        - text: SPLITWIRE NEDİR?
        - heading "SplitWire Turkey ne işe yarar?" [level=2] [ref=f7e40]
      - article [ref=f7e41]:
        - paragraph [ref=f7e42]: SplitWire Turkey, Windows'ta farklı DPI aşımı ve uygulamaya özel tünelleme yöntemlerini tek arayüzden kurup yönetmeye yarayan açık kaynaklı bir projedir. Hangi bağlantı yönteminin kullanılacağı seçilen kurulum türüne bağlıdır.
        - paragraph [ref=f7e43]:
          - text: Bu sayfadaki 1.5.7 videosunda
          - strong [ref=f7e44]: Standart Kurulum
          - text: ve WireSock gösteriliyor; video sonundaki açıklama bu kurulumun Discord için çalıştığını belirtiyor. Bu, tüm bilgisayarı başka bir VPN sunucusuna bağlayan genel amaçlı bir VPN hizmetiyle aynı şey değildir.
        - list [ref=f7e45]:
          - listitem [ref=f7e46]: Kurulum türüne göre Discord bağlantısı için ilgili yöntemi yapılandırır.
          - listitem [ref=f7e47]: Daha yeni sürümlerde farklı sekmeler, tarayıcı tünellemesi ve başka yöntemler bulunabilir; bu rehber 1.5.7 kaydını anlatır.
          - listitem [ref=f7e48]: İndirme bağlantısı drive.google.com'ya gider. Çalıştırmadan önce dosyanın yayıncısını ve kaynağını doğrula.
