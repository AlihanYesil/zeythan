          - generic [ref=f5e64]:
            - heading "Arşivi indir ve çıkart" [level=3] [ref=f5e65]
            - paragraph [ref=f5e66]:
              - text: Yukarıdaki bağlantıdan SplitWire Turkey 1.5.7 RAR arşivini indir. Windows'un arşiv aracını veya güvendiğin bir arşiv programını kullanarak içeriğini yeni bir klasöre çıkart. Kurulum dosyasının adı videoda
              - strong [ref=f5e67]: SplitWire-Turkey-Setup-Windows.exe
              - text: olarak görünüyor.
            - paragraph [ref=f5e68]:
              - generic [aria-hidden] [ref=f5e69]: 
              - text: "RAR şifresi:"
              - strong [ref=f5e70]: Zeythan
        - article [ref=f5e71]:
          - generic [ref=f5e72]: "02"
          - generic [ref=f5e73]:
            - heading "Kurulum uygulamasını aç" [level=3] [ref=f5e74]
            - paragraph [ref=f5e75]: "Çıkarttığın klasördeki SplitWire-Turkey uygulamasını başlat. Ekran kaydında Windows SmartScreen uyarısı için “Ek bilgi” ve “Yine de çalıştır” adımları anlatılıyor. Bu uyarıyı otomatik olarak geçme: yayıncı bilgisi doğrulanamıyorsa kurulumu durdur ve dosyanın kaynağını doğrula."
        - article [ref=f5e76]:
          - generic [ref=f5e77]: "03"
          - generic [ref=f5e78]:
            - heading "“Standart Kurulum”u seç" [level=3] [ref=f5e79]
            - paragraph [ref=f5e80]: Ana ekranda Standart Kurulum düğmesine tıkla. Onay penceresinde devam etmek istediğini seç. Videoda WireSock bileşeni yüklü olmadığında kurulumun bu bileşeni de indirdiği belirtiliyor.
        - article [ref=f5e81]:
          - generic [ref=f5e82]: "04"
          - generic [ref=f5e83]:
            - heading "Kurulumun bitmesini bekle" [level=3] [ref=f5e84]
            - paragraph [ref=f5e85]: “Kurulum başarıyla tamamlandı” mesajı geldiğinde ekrandaki yönergeyi izle. Değişikliklerin uygulanması için bilgisayarı şimdi yeniden başlatabilir ya da yeniden başlatmayı daha sonraya bırakabilirsin.
        - article [ref=f5e86]:
          - generic [ref=f5e87]: "05"
          - generic [ref=f5e88]:
            - heading "Yeniden başlat ve Discord'u dene" [level=3] [ref=f5e89]
            - paragraph [ref=f5e90]: Videoda bilgisayar yeniden başlatılıyor. Açıldıktan sonra Discord'u çalıştırıp mesaj ve ses bağlantısını kontrol et. Kaydın sonundaki not, standart kurulumun WireSock korumasını yalnızca Discord için uyguladığını söylüyor.
